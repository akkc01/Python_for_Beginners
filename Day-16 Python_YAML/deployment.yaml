apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-deployment
spec:
  selector:
    matchLabels:
      app: axion-app
  template:
    metadata:
      labels:
        app: axion-app
    spec:
      containers:
      - name: axion-ui
        image: myacr.azurecr.io/axion-api:v1.2.5
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
